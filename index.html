<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      `user-scalable=no, maximum-scale=1` because the game owns its own pinch
      gesture: desktop Chrome honours both, and a browser zoom applied on top of
      the game's own would fight it for the same two fingers on a trackpad.
      `src/platform/webview.js` blocks what these two cannot reach.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1"
    />
    <!--
      The UI is a light scheme now — white plates, dark navy type — and this is
      what stops the browser painting its own dark form controls and scrollbars
      underneath it. It is also what the nickname `<input>` inherits: it is the
      one real DOM control in the game, and under `dark` it came up as a dark
      field in the middle of a white modal.
    -->
    <meta name="color-scheme" content="light" />
    <title>한여름 알까기</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="병뚜껑 3D 뷰어"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<meta charset="utf-8" />
<title>roles preview</title>
<style>
  html, body { margin: 0; background: #7fb2d8; }
  canvas { display: block; margin: 0 auto; }
</style>
<script type="module">
  import { dialogPanel, roleButton } from '/src/ui/glass.js';
  import { PANEL, ROLE, SIZE } from '/src/core/tokens.js';
  import { whenFontsReady } from '/src/ui/fonts.js';

  await whenFontsReady();

  const S = 2;
  document.body.style.zoom = '1.6';
  const W = PANEL.width;
  const H = 340;
  const TAB = PANEL.titleTabHeight;

  const c = document.createElement('canvas');
  c.width = W * S; c.height = (H + TAB + 20) * S;
  c.style.width = `${W}px`;
  c.style.height = `${H + TAB + 20}px`;
  document.body.appendChild(c);
  const x = c.getContext('2d');
  x.scale(S, S);

  const box = dialogPanel(x, { w: W, h: H, title: 'TV 해상도' });

  // CHOICE column
  const cw = W - PANEL.padX * 2;
  const rows = ['선택지 하나', '선택지 둘', '선택지 셋'];
  let y = box.contentTop;
  rows.forEach((label, i) => {
    roleButton(x, {
      x: PANEL.padX, y, w: cw, h: SIZE.buttonChoice.h,
      label, role: ROLE.CHOICE, selected: i === 1,
    });
    y += SIZE.buttonChoice.h + 14;
  });

  // footer
  const fy = box.footerTop + (PANEL.footerHeight - SIZE.buttonFooter.h) / 2;
  roleButton(x, {
    x: PANEL.padX, y: fy, w: SIZE.buttonFooter.w, h: SIZE.buttonFooter.h,
    label: '뒤로', role: ROLE.RETREAT,
  });
  roleButton(x, {
    x: W - PANEL.padX - SIZE.buttonFooter.w, y: fy,
    w: SIZE.buttonFooter.w, h: SIZE.buttonFooter.h,
    label: '확인', role: ROLE.COMMIT,
  });

  // a second panel: destructive
  const c2 = document.createElement('canvas');
  c2.width = W * S; c2.height = 200 * S;
  c2.style.width = `${W}px`; c2.style.height = '200px';
  document.body.appendChild(c2);
  const x2 = c2.getContext('2d');
  x2.scale(S, S);
  const b2 = dialogPanel(x2, { w: W, h: 160, title: '마크 삭제' });
  const fy2 = b2.footerTop + (PANEL.footerHeight - SIZE.buttonFooter.h) / 2;
  roleButton(x2, { x: PANEL.padX, y: fy2, w: SIZE.buttonFooter.w, h: SIZE.buttonFooter.h, label: '취소', role: ROLE.RETREAT });
  roleButton(x2, { x: W - PANEL.padX - SIZE.buttonFooter.w, y: fy2, w: SIZE.buttonFooter.w, h: SIZE.buttonFooter.h, label: '삭제', role: ROLE.DESTRUCTIVE });
</script>
